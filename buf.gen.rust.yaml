version: v2
plugins:
  # Message types. One file per proto package — no packaging plugin.
  - local: protoc-gen-buffa
    out: rust/api/gen/buffa
    opt:
      - file_per_package=true
      - json=true
      - views=true
  # Connect stubs. Separate out: — both plugins emit <pkg>.rs.
  - local: protoc-gen-connect-rust
    out: rust/api/gen/connect
    opt:
      - file_per_package
      - buffa_module=crate::buffa
