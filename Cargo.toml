[workspace]
resolver = "2"
members = [
    "rust/api",
    "rust/buf/plugins",
    "rust/echo/client",
    "rust/echo/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
api = { path = "rust/api" }
buffa = { version = "=0.8.1", default-features = false, features = [
    "std",
    "fast-utf8",
    "json",
] }
buffa-codegen = "=0.8.1"
buffa-descriptor = "=0.8.1"
buffa-types = "=0.8.1"
bytes = "=1.12.1"
cargo-audit = { version = "=0.22.2", default-features = false }
connectrpc = { version = "=0.8.1", default-features = false }
connectrpc-codegen = "=0.8.0"
connectrpc-health = { version = "=0.8.0", default-features = false }
http = "=1.5.0"
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.4.5" }
protoc-gen-protovalidate-buffa = { git = "https://github.com/mathematic-inc/protovalidate-buffa", tag = "v0.6.0" }
protovalidate-buffa = { version = "=0.6.0", default-features = false, features = [
    "connect",
] }
serde = { version = "=1.0.229", default-features = false, features = [
    "derive",
    "std",
] }
tokio = { version = "=1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
