# markdownlint-cli2 config (https://github.com/DavidAnson/markdownlint-cli2)
config:
  default: true
  # READMEs often wrap poorly in tables / long URLs.
  MD013: false
  # Allow HTML in docs if needed later.
  MD033: false
  # Skills repeat Required/Forbidden under different parents.
  MD024:
    siblings_only: true

globs:
  - "**/*.md"

ignores:
  - ".venv/**"
  - "result*/**"
  - "**/node_modules/**"
  - ".bazel/**"
