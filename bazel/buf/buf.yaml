# Bazel-only workspace config. buf_module copies this to the staged root as buf.yaml
# and places @protovalidate_proto at third_party/protovalidate (see buf.MODULE.bazel).
version: v2
modules:
  - path: .
    includes:
      - api
  - path: third_party/protovalidate
    name: buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
