name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same host as the LLVM Debian 13 sysroots. libxml2 is required by prebuilt
# ld.lld; libc6-dev by Python native sdists (msgpack) compiled with that clang.
jobs:
  ci:
    name: Bazel
    runs-on: ubuntu-latest
    container:
      image: debian:13
    timeout-minutes: 90
    env:
      BAZELISK_VERSION: 1.29.0
      BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            libc6-dev \
            libxml2 \
            patch

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /tmp/bazelisk" | sha256sum -c
          install -m 0755 /tmp/bazelisk /usr/local/bin/bazel

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Cache Bazel
        uses: actions/cache@v6.1.0
        with:
          path: /github/home/.cache/bazel
          key: bazel-debian13-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock', 'go.sum', 'uv.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            bazel-debian13-

      - name: Check generated code is up to date
        run: bazel test //api/v1:generate_tests --test_output=all

      - name: Test
        run: bazel test //... --keep_going --test_output=all

      - name: Build
        run: bazel build //... --keep_going
