name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # Store built paths in GitHub Actions cache (skip FlakeHub).
          use-flakehub: false
          use-gha-cache: true

      - name: Lint
        run: nix run .#lint-all

      - name: Check generated code is up to date
        run: nix run .#generate-check

      - name: Vulnerability scan
        run: nix run .#vuln-all

      - name: Build host artifacts
        run: nix build .#default --no-link --print-build-logs

      - name: Evaluate full artifact set
        run: nix build .#all --dry-run

      - name: Test
        run: nix run .#test
