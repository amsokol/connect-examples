name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Official Actions Cache (one store archive) — avoids Magic Nix Cache GHA throttle/418.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'tools.version.toml', 'Cargo.lock', 'go.sum', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep store under GHA cache size budget (~10G) before save.
          gc-max-store-size-linux: 8G
          # No purge: would need permissions.actions: write.

      - name: Lint
        run: nix run .#lint-all

      - name: Check generated code is up to date
        run: nix run .#generate-check

      - name: Vulnerability scan
        run: nix run .#vuln-all

      - name: Build host artifacts
        run: nix build .#default --no-link --print-build-logs

      - name: Evaluate full artifact set
        run: nix build .#all --dry-run

      - name: Test
        run: nix run .#test
